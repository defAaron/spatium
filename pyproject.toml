[project]
name = "spatium"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "httpx>=0.28.1,<1",
    "pillow>=12,<14",
    "python-multipart>=0.0.26,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
depth = [
    "numpy>=1.26,<3",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.49,<5",
]
