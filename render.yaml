services:
  - type: web
    name: spatium-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --locked
    startCommand: .venv/bin/uvicorn spatium.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: SPATIUM_SESSION_SECRET
        generateValue: true
      - key: SPATIUM_DATABASE_URL
        sync: false
      - key: SPATIUM_R2_ACCOUNT_ID
        sync: false
      - key: SPATIUM_R2_ACCESS_KEY_ID
        sync: false
      - key: SPATIUM_R2_SECRET_ACCESS_KEY
        sync: false
      - key: SPATIUM_R2_BUCKET
        sync: false
